name: Windows build and installer

on:
  workflow_dispatch:
  push:
    branches: [native-cpp, main]
  pull_request:
    branches: [native-cpp, main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qttools'
          setup-python: false

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DCMAKE_INSTALL_BINDIR=bin `
            -DCMAKE_INSTALL_DATADIR=share `
            -DBUILD_TESTING=OFF

      - name: Build compiler and Studio
        shell: pwsh
        run: cmake --build build-win --config Release --target pebble pebble_native pebble_studio --parallel

      - name: Install into staging directory
        shell: pwsh
        run: |
          cmake --install build-win --config Release
          $qtBin = (Get-Command windeployqt).Source | Split-Path
          & "$qtBin\windeployqt.exe" --release --compiler-runtime --dir stage\bin stage\bin\pebble_studio.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\Pebble.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pebble-windows-x64-installer
          path: packaging/output/Pebble-0.3.1-Windows-x64-Setup.exe
          if-no-files-found: error