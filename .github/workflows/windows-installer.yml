name: Windows build and installer

on:
  workflow_dispatch:
  push:
    branches: [native-cpp, main]
  pull_request:
    branches: [native-cpp, main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install aqtinstall

      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m aqt list-qt windows desktop --modules 6.7.2 win64_msvc2019_64
          echo "C:\Qt\6.7.2\msvc2019_64\bin" >> $env:GITHUB_PATH
          echo "Qt6_DIR=C:/Qt/6.7.2/msvc2019_64/lib/cmake/Qt6" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DCMAKE_INSTALL_BINDIR=bin `
            -DCMAKE_INSTALL_DATADIR=share `
            -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.7.2/msvc2019_64"

      - name: Build compiler and Studio
        shell: pwsh
        run: cmake --build build-win --config Release --target pebble pebble_native pebble_studio --parallel

      - name: Install into staging directory
        shell: pwsh
        run: |
          cmake --install build-win --config Release
          $qtBin = (Get-Command windeployqt).Source | Split-Path
          & "$qtBin\windeployqt.exe" --release --compiler-runtime --dir stage\bin stage\bin\pebble_studio.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\Pebble.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pebble-windows-x64-installer
          path: packaging/output/Pebble-0.3.1-Windows-x64-Setup.exe
          if-no-files-found: error