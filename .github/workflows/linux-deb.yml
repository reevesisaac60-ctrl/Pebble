
name: Linux Debian package

on:
  workflow_dispatch:
  push:
    branches: [native-cpp, main]
  pull_request:
    branches: [native-cpp, main]

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libglfw3-dev \
            libgl1-mesa-dev \
            dpkg-dev \
            desktop-file-utils

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Install Debian package
        run: |
          sudo apt-get install -y ./package-output/pebble_*_amd64.deb

      - name: Verify installed executables
        run: |
          pebble --help
          pebble_native --help

      - name: Verify installed examples
        run: |
          pebble check /usr/share/pebble/examples/language/basics.peb
          pebble check /usr/share/pebble/examples/language/statements.peb

      - name: Verify desktop integration
        run: |
          desktop-file-validate /usr/share/applications/pebble-studio.desktop
          test -x /usr/bin/pebble
          test -x /usr/bin/pebble_native
          test -x /usr/bin/pebble_studio
          test -d /usr/share/pebble/assets
          test -d /usr/share/pebble/examples

      - name: Verify shared libraries
        run: |
          for executable in pebble pebble_native pebble_studio; do
            if ldd "/usr/bin/$executable" | grep -q "not found"; then
              echo "Missing shared library for $executable"
              exit 1
            fi
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: pebble-linux-amd64-deb
          path: package-output/pebble_*_amd64.deb
          if-no-files-found: error
